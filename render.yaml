services:
  - type: web
    name: sentinelops-ui
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: VITE_API_BASE_URL
        value: https://backend-repo-nlsi.onrender.com